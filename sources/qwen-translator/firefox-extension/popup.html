<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>网页翻译</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
</head>
<body class="popup">
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon.svg" width="40" height="40" alt="">
      <div>
        <h1>网页翻译</h1>
        <span>一键读懂外语网页</span>
      </div>
    </div>
    <button id="settings" class="icon-button" type="button" title="设置" aria-label="打开设置">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>
    </button>
  </header>

  <section class="card language">
    <label for="target">翻译成</label>
    <select id="target">
      <option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option>
      <option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option>
      <option value="fr">Français</option><option value="de">Deutsch</option><option value="es">Español</option>
    </select>
  </section>

  <button data-mode="bilingual" class="primary hero" type="button">
    <span class="hero-title">翻译此网页</span>
    <span class="hero-sub">原文和译文对照显示</span>
  </button>
  <div class="actions">
    <button data-mode="translation" type="button">只看译文</button>
    <button data-mode="off" type="button">显示原文</button>
  </div>

  <p id="status" class="notice" role="status">会保留网页排版和链接，菜单、按钮等不会被翻译。</p>

  <label class="switch-row">
    <span><strong>记住翻译结果</strong><small>再次打开同一网页时更快</small></span>
    <input id="auto-save" class="switch" type="checkbox" checked>
  </label>

  <p id="shortcut" class="hint">快捷键</p>
  <script src="popup.js"></script><script src="shortcuts.js"></script>
</body>
</html>
