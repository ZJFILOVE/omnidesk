<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>同声 · 实时语音与镜头翻译</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260522-github-social-chip" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-header">
          <div class="brand-title-row">
            <span class="brand-badge">译</span>
            <div>
              <h1>同声 · 实时语音翻译</h1>
              <p class="brand-subtitle">边说边译，自然顺畅的跨语言沟通体验</p>
            </div>
          </div>
          <nav class="mode-tabs" aria-label="Demo mode">
            <button id="micTab" class="mode-tab active" type="button">语音对话</button>
            <button id="cameraTab" class="mode-tab" type="button">镜头辅助翻译</button>
          </nav>
        </div>
        <div class="status-pill">
          <span id="statusDot" class="status-dot"></span>
          <span id="statusText">准备就绪</span>
        </div>
      </header>

      <section id="workspace" class="workspace">
        <article id="cameraPanel" class="panel camera-panel" hidden>
          <div class="panel-label">镜头画面</div>
          <div class="camera-stage">
            <video id="cameraPreview" autoplay muted playsinline></video>
            <div id="cameraSubtitle" class="camera-subtitle">翻译后的字幕将实时显示在这里。</div>
          </div>
        </article>
        <article class="panel">
          <div class="panel-label">识别原文</div>
          <div id="sourceText" class="live-text placeholder">点击「开始翻译」并对着麦克风说话。</div>
        </article>
        <article class="panel translation-panel">
          <div class="panel-label">实时译文</div>
          <div id="translationText" class="live-text translation-text placeholder">翻译结果将实时显示在这里。</div>
        </article>
      </section>

      <section id="audioRecord" class="audio-record" hidden>
        <div class="audio-record-icon">♪</div>
        <div class="audio-record-meta">
          <div class="audio-record-title">本次译音回放</div>
          <div id="audioRecordDetails" class="audio-record-details">停止翻译后可在此回听</div>
        </div>
        <audio id="audioRecordPlayer" controls></audio>
      </section>

      <section class="controls">
        <div class="control-group credentials-group">
          <label class="api-key-label">
            <span class="label-with-help">
              服务密钥 (API Key)
              <button id="apiKeyHelpButton" class="help-button" type="button" aria-label="Open API key console">?</button>
            </span>
            <span class="api-key-field">
              <input id="apiKey" class="api-key-input" type="password" autocomplete="off" placeholder="填写百炼 API Key" />
              <button id="forgetKeyButton" class="icon-button" type="button" aria-label="Clear API key">×</button>
            </span>
          </label>
        </div>
        <div class="settings-group">
          <div class="control-group language-group">
            <label>
              翻译为
              <select id="targetLanguage"></select>
            </label>
            <label class="switch-field">
              <span class="field-label">语音播报</span>
              <span class="toggle compact-toggle output-toggle">
                <input id="audioEnabled" type="checkbox" checked />
                <span id="audioToggleText">开启</span>
              </span>
            </label>
            <label>
              播报人声
              <select id="voice"></select>
            </label>
          </div>
          <details id="advancedSettings" class="advanced-drawer">
            <summary>高级设置 · 服务区域、声音模仿与镜头参数</summary>
            <div class="advanced-grid">
              <label>
                服务区域
                <select id="region">
                  <option value="mainland" selected>中国内地（北京）</option>
                  <option value="intl">国际（新加坡）</option>
                </select>
              </label>
              <label>
                说话人识别
                <select id="sourceLanguage"></select>
              </label>
              <label>
                声音模仿（音色复刻）
                <select id="voiceCloneMode">
                  <option value="off" selected>关闭（使用固定人声）</option>
                  <option value="once">模仿单人声音（首次采样）</option>
                  <option value="always">每句跟随说话人声音</option>
                </select>
              </label>
              <div class="control-group visual-group camera-control" hidden>
                <label>
                  摄像头设备
                  <select id="cameraDevice"></select>
                </label>
                <label class="toggle camera-control" hidden>
                  <input id="visualContextEnabled" type="checkbox" checked />
                  <span>结合画面内容辅助翻译</span>
                </label>
                <label class="compact-control">
                  画面采样频率
                  <select id="frameRate">
                    <option value="1" selected>标准 (1 帧/秒)</option>
                    <option value="2">高频 (2 帧/秒)</option>
                  </select>
                </label>
              </div>
            </div>
          </details>
        </div>
        <div class="control-group action-group">
          <button id="startButton" class="primary-action" type="button">开始翻译</button>
          <button id="stopButton" class="danger-action" type="button" disabled>结束</button>
          <button id="clearButton" class="secondary-button" type="button">清空内容</button>
        </div>
      </section>

      <footer class="meter-row">
        <div class="meter"><div id="levelBar"></div></div>
        <div id="metrics" class="metrics">准备就绪 · 点击「开始翻译」即可开始</div>
        <div class="social-footer" aria-label="Project links">
          <a class="social-link github-social-link" href="https://github.com/modelstudioai" target="_blank" rel="noopener noreferrer" aria-label="Open Model Studio AI on GitHub">
            <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2C6.48 2 2 6.58 2 12.22c0 4.5 2.87 8.32 6.84 9.67.5.1.68-.22.68-.49 0-.24-.01-1.04-.01-1.88-2.78.62-3.37-1.22-3.37-1.22-.45-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.9 1.56 2.35 1.11 2.92.85.09-.66.35-1.11.63-1.37-2.22-.26-4.56-1.14-4.56-5.05 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.27 2.75 1.05A9.29 9.29 0 0 1 12 6.91c.85 0 1.7.12 2.5.34 1.9-1.32 2.74-1.05 2.74-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.92-2.34 4.79-4.57 5.04.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.8 0 .27.18.59.69.49A10.11 10.11 0 0 0 22 12.22C22 6.58 17.52 2 12 2Z" />
            </svg>
            <span>GitHub</span>
            <span class="github-qr-popover" aria-hidden="true">
              <img src="/static/github-qr.svg" alt="" />
              <span>github.com/modelstudioai</span>
            </span>
          </a>
        </div>
      </footer>
    </main>
    <script src="/static/app.js?v=20260522-voice-config-default-on"></script>
  </body>
</html>
