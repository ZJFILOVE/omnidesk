[package]
name = "omnidesk"
version = "0.1.0"
description = "OmniDesk v2 minimal Tauri v2 native shell"
edition = "2021"

[lib]
name = "omnidesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
