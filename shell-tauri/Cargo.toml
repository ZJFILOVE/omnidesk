[package]
name = "omnidesk"
version = "0.1.0"
description = "OmniDesk v2 minimal Tauri v2 native shell"
edition = "2021"

[lib]
name = "omnidesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
pkg-config = "0.3"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "sync"] }
libc = "0.2"
dbus = "0.9"
base64 = "0.22"
jpeg-encoder = "0.6"
libloading = "0.8"

[features]
custom-protocol = ["tauri/custom-protocol"]
libmpv = []

[profile.dev]
debug = 0
